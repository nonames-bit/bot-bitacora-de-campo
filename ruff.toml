# Configuración de ruff. Base: errores reales (E9) y pyflakes (F).
# (P2.10) Se agregan familias que hoy tienen CERO hallazgos en el repo, para
# endurecer el lint a futuro sin cleanup:
#   A   = shadowing de builtins (id, type, list…)
#   PLE = errores de pylint (variables/atributos inexistentes, etc.)
#   EXE = shebangs/permisos de ejecución
#   FA  = futuro `from __future__ import annotations`
# Pendiente de una limpieza dedicada (con fallout real hoy): B (bugbear: 36),
# S (bandit: ~285 con los patrones intencionales), ASYNC (~89 en telegram_bot),
# DTZ (~196 date.today/datetime.now naive). Ver auditoría P2.10.
# Ya habilitados por bajo riesgo y cero/limpieza aplicada: B033 (set/dict con
# valor duplicado), B905 (zip sin strict=), B006 (default mutable; src/ y tests/
# están limpios) y S105/S106 (contraseñas hardcodeadas; scripts/ y tests/ usan
# claves de prueba a propósito).
line-length = 160

[lint]
select = ["E9", "F", "A", "PLE", "EXE", "FA", "B006", "B033", "B905", "S105", "S106"]

[lint.per-file-ignores]
# telegram_bot.py y query_engine.py son fachadas: reexportan nombres a
# propósito para mantener estable la API pública (los usan tests y otros
# módulos), así que los "unused import" de ahí son falsos positivos.
"src/server/telegram_bot.py" = ["F401"]
"src/engine/query_engine.py" = ["F401"]
"src/engine/query/__init__.py" = ["F401"]
# En tests es normal registrar datos (ej. un potrero) sin usar el id devuelto, y
# usar contraseñas/PIN de prueba.
"tests/*" = ["F841", "S105", "S106"]
# Los scripts de verificación usan una contraseña/centinela de prueba deliberada.
"scripts/*" = ["S105", "S106"]
# El harness de verificación visual usa un default mutable A PROPÓSITO como
# contador del protocolo CDP (`msg_id=[1]`, la misma lista persiste entre
# llamadas). Es una herramienta local, no código de producción.
"scripts/verify_*.py" = ["B006"]
