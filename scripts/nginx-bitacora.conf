# Nginx vhost — PWA Bitácora JA en producción (TLS)
#
# Instalación en el VPS (Ubuntu, tras haber configurado el bot con
# scripts/setup_vps.sh):
#
#   1. Copiar este archivo:
#        sudo cp scripts/nginx-bitacora.conf /etc/nginx/sites-available/bitacora-pwa
#        sudo ln -s /etc/nginx/sites-available/bitacora-pwa /etc/nginx/sites-enabled/
#
#   2. Cambia SERVER_NAME por tu dominio o IP del droplet.
#
#   3. Emitir certificado TLS con Let's Encrypt (dominio) o dejar HTTP si
#      es solo red LAN interna (quita el bloque 443 y el rewrite 80→443).
#      Con dominio:  sudo certbot --nginx -d bitacora.ejemplo.com
#
#   4. Validar y recargar:
#        sudo nginx -t && sudo systemctl reload nginx

# --- HTTP :80 → redirige a HTTPS (solo si hay dominio/certbot) ---
server {
    listen 80;
    listen [::]:80;
    server_name bitacora.ejemplo.com;   # <-- AJUSTAR

    # Sin certificado aún: comenta estas dos líneas para servir HTTP plano.
    location /.well-known/acme-challenge/ { root /var/www/html; }
    location / { return 301 https://$host$request_uri; }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name bitacora.ejemplo.com;   # <-- AJUSTAR

    # Certificados Let's Encrypt (los crea certbot si corres:
    #   sudo certbot --nginx -d bitacora.ejemplo.com )
    ssl_certificate     /etc/letsencrypt/live/bitacora.ejemplo.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/bitacora.ejemplo.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    # Los archivos grandes (fotos del arete que sube el corral) no deben
    # fallar por el límite por defecto de Nginx (1 MB).
    client_max_body_size 25m;

    # NOTA: NO usar `location /static/ { alias /root/bitacora/... }` aquí.
    # Se probó en el VPS real y da 403 Forbidden: Nginx corre como
    # www-data, que no tiene permiso para atravesar /root (el home de
    # root suele ser 700). Abrir permisos de /root solo para esto no vale
    # la pena -- se deja TODO (incluido /static/) proxied a Flask/waitress,
    # que ya sirve los estáticos correctamente (sw.js ya manda sus propios
    # headers de no-cache, ver src/pwa/app.py::sw_js()).

    # App Flask/waitress en el loopback.
    location / {
        proxy_pass http://127.0.0.1:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 90s;
        # EventSource/streaming no usado; timeout estándar suficiente.
    }

    # Cabeceras de seguridad mínimas.
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header X-Frame-Options SAMEORIGIN always;
    # Política de contenidos: la app no usa scripts/CDN externos ni estilos
    # externos; style-src 'unsafe-inline' por el CSS inline del login/offline.
    add_header Content-Security-Policy "default-src 'self'; img-src 'self' data:; script-src 'self'; style-src 'self' 'unsafe-inline'; connect-src 'self'; object-src 'none'; frame-ancestors 'self'" always;
}
