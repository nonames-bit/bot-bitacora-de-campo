name: docker

# Cuando los tests pasan en main: comprueba que la imagen Docker se construye
# (sin publicarla en ningún registro) y, si el servidor está configurado
# (secrets VPS_HOST, VPS_USUARIO, VPS_SSH_KEY), le pide que se actualice: el
# propio servidor descarga el código nuevo y arma la imagen. Así no se usa
# almacenamiento de paquetes de GitHub.
on:
  workflow_run:
    workflows: ["tests"]
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  construir:
    if: ${{ github.event_name == 'workflow_dispatch' || (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}

      - name: Construir la imagen (verificación, no se publica)
        run: docker build -t bitacora:verificacion .

  desplegar:
    needs: construir
    runs-on: ubuntu-latest
    concurrency:
      group: despliegue-produccion
      cancel-in-progress: false
    env:
      VPS_HOST: ${{ secrets.VPS_HOST }}
      VPS_USUARIO: ${{ secrets.VPS_USUARIO }}
      VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
      VPS_DIR: ${{ vars.VPS_DIR || '/opt/bitacora' }}
    steps:
      - name: Actualizar el servidor
        run: |
          if [ -z "$VPS_HOST" ] || [ -z "$VPS_SSH_KEY" ]; then
            echo "Servidor no configurado (secrets VPS_HOST / VPS_SSH_KEY): se omite el despliegue."
            exit 0
          fi
          # Limpiar posibles espacios, prefijos ssh/http o usuario incluido en el host
          HOST=$(echo "$VPS_HOST" | tr -d '[:space:]' | sed -e 's|^.*@||' -e 's|^https\?://||' -e 's|/.*$||')
          USUARIO=$(echo "${VPS_USUARIO:-root}" | tr -d '[:space:]' | sed -e 's|@.*||')
          USUARIO=${USUARIO:-root}
          DIR=$(echo "${VPS_DIR:-/opt/bitacora}" | tr -d '[:space:]')
          install -m 700 -d ~/.ssh
          echo "$VPS_SSH_KEY" > ~/.ssh/id_despliegue
          chmod 600 ~/.ssh/id_despliegue
          ssh-keyscan -H "$HOST" >> ~/.ssh/known_hosts 2>/dev/null
          ssh -i ~/.ssh/id_despliegue "$USUARIO@$HOST" \
            "cd '$DIR' && git pull --ff-only && docker compose up -d --build --remove-orphans && docker image prune -f"
