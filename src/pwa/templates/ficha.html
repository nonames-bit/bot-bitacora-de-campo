<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Ficha {{ tag }} · Bitácora JA</title>
<meta name="theme-color" content="#2F5233">
<link rel="manifest" href="/manifest.json">
<link rel="icon" href="/static/favicon.png" type="image/png">
<link rel="icon" href="/static/favicon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="/static/icon-192.png">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="stylesheet" href="/static/style.css?v={{ pwa_v or 'dev' }}">
</head>
<body data-tag="{{ tag }}">
<div id="barra-red">📡 Sin conexión — mostrando datos guardados. Reconectando…</div>
<header>
  <span class="marca-titulo"><a href="/" style="text-decoration:none; color:inherit; display:inline-flex; align-items:center; gap:6px;"><img src="/static/logo.jpg" class="logo-ja" alt="Logo Ganadería JA" width="22" height="22">← Tablero</a> · <span style="display:inline-flex; align-items:center; gap:5px;"><svg class="svg-icon" viewBox="0 0 24 24" width="16" height="16" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" fill="none"><path d="M17.8 15.1a10 10 0 0 0 .9-7.1h.3c1.7 0 3-1.3 3-3V3h-3c-1.3 0-2.4.8-2.8 1.9a10 10 0 0 0-8.4 0C7.4 3.8 6.3 3 5 3H2v2c0 1.7 1.3 3 3 3h.3a10 10 0 0 0 .9 7.1M9 9.5v.5m6-.5v.5"/><path d="M15 22a4 4 0 1 0-3-6.6A4 4 0 1 0 9 22Zm-6-4h.01M15 18h.01"/></svg><span>Ficha</span></span> <b>{{ tag }}</b></span>
  <span class="header-pasto header-pasto-ficha" id="header-pasto" aria-label="Ganado en pastoreo"><span id="header-cielo" class="header-cielo" aria-hidden="true"><span id="header-clima-sol" class="clima-sol" style="display:none;" title="Día soleado"><svg class="svg-sol" viewBox="0 0 24 24" width="20" height="20" fill="none"><circle cx="12" cy="12" r="4.5" fill="#FFD159" stroke="#FFA726" stroke-width="1.5"/><path d="M12 2.5v2M12 19.5v2M3.9 3.9l1.5 1.5M18.6 18.6l1.5 1.5M2.5 12h2M19.5 12h2M3.9 20.1l1.5-1.5M18.6 5.4l1.5-1.5" stroke="#FFA726" stroke-width="1.8" stroke-linecap="round"/></svg></span><span id="header-clima-luna" class="clima-luna" style="display:none;" title="Noche serena"><svg class="svg-luna" viewBox="0 0 24 24" width="18" height="18" fill="none"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z" fill="#FFF2B2" stroke="#F4C742" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/></svg><span class="estrellita est-1">✦</span><span class="estrellita est-2">✧</span><span class="estrellita est-3">✦</span></span><span id="header-clima-nubes" class="clima-nubes" style="display:none;" title="Cielo nublado"><svg class="svg-nube nube-1" viewBox="0 0 24 24" width="20" height="12"><path d="M17.5 19H9a7 7 0 1 1 6.71-9h1.79a4.5 4.5 0 1 1 0 9Z" class="nube-forma"/></svg><svg class="svg-nube nube-2" viewBox="0 0 24 24" width="15" height="9"><path d="M17.5 19H9a7 7 0 1 1 6.71-9h1.79a4.5 4.5 0 1 1 0 9Z" class="nube-forma"/></svg></span></span><span class="vaca-pista"><span class="vaca-ambula"><span class="vaca-pasta"><img id="header-vaca-img" src="/static/vaca_comiendo.gif?v={{ pwa_v }}" class="vaca-img" alt="Vaca en el potrero" width="48" height="26" title="Toca la vaquita para ver estado rápido"></span></span></span><span id="header-lluvia" class="header-lluvia" style="display:none;" aria-hidden="true"><span class="nube-lluvia"><svg viewBox="0 0 24 24" width="22" height="13"><path d="M17.5 19H9a7 7 0 1 1 6.71-9h1.79a4.5 4.5 0 1 1 0 9Z" fill="rgba(120, 150, 175, 0.85)" stroke="rgba(180, 215, 240, 0.9)" stroke-width="1"/></svg></span></span><div id="vaca-bubble" class="vaca-speech-bubble" style="display:none;" role="tooltip"></div></span>
  <span class="acciones">
    <button id="btn-ayuda" class="tema-btn" title="Centro de Ayuda y Manuales" aria-label="Ayuda"><svg class="svg-icon" viewBox="0 0 24 24" width="15" height="15" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" fill="none"><circle cx="12" cy="12" r="10"/><path d="M9.09 9a3 3 0 0 1 5.83 1c0 2-3 3-3 3"/><line x1="12" y1="17" x2="12.01" y2="17"/></svg></button>
    <select id="select-tema" class="tema-btn" title="Estilo visual" aria-label="Cambiar tema">
      <option value="green">Verde Campestre</option>
      <option value="sun">Sol de Campo</option>
      <option value="light">Claro Editorial</option>
      <option value="dark">Modo Oscuro</option>
    </select>
    <a href="/logout" class="salir">Salir</a>
  </span>
</header>
<main>
  <div id="ficha" class="card">Cargando…</div>

  <!-- Chat Dock Flotante / Expansible (Estilo WhatsApp con Micrófono) -->
  <div id="chat-dock" class="chat-dock colapsado">
    <button type="button" id="chat-dock-burbuja" class="chat-dock-burbuja" title="Abrir Asistente IA" aria-label="Abrir Asistente IA">
      <img src="/static/logo.jpg" alt="Asistente IA">
    </button>
    <div class="chat-dock-header">
      <div class="chat-dock-titulo">
        <img src="/static/logo.jpg" class="logo-ja" alt="Logo" width="20" height="20">
        <span><b>Asistente IA</b> · Ganadería JA</span>
      </div>
      <div class="chat-dock-controles">
        <button type="button" id="btn-limpiar-chat" class="chat-btn-min" title="Limpiar conversación">🧹</button>
        <button type="button" id="btn-colapsar-chat" class="chat-btn-min" title="Minimizar">▼</button>
        <button type="button" id="btn-cerrar-chat" class="chat-btn-min" title="Cerrar" style="display:none">✕</button>
      </div>
    </div>

    <div id="chat-historial" class="chat-cuerpo">
      <div class="chat-msg bot">Hola. Soy el asistente inteligente de la finca. Puedes hacerme preguntas sobre este animal <b>{{ tag }}</b> o dictarme notas con el micrófono 🎙️.</div>
    </div>

    <div class="chat-dock-footer">
      <div id="chat-audio-grabando" class="chat-audio-bar" style="display:none">
        <div class="chat-audio-info">
          <span class="chat-audio-dot"></span>
          <span id="chat-audio-timer">0:00</span>
          <span class="chat-audio-txt">Grabando audio…</span>
        </div>
        <div class="chat-audio-btns">
          <button type="button" id="btn-cancelar-audio" class="btn-audio-cancelar" title="Descartar">✕</button>
          <button type="button" id="btn-enviar-audio" class="btn-audio-enviar" title="Enviar nota de voz">
            <svg class="svg-icon" viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"/></svg>
          </button>
        </div>
      </div>

      <form id="form-chat" class="chat-dock-form">
        <button type="button" id="btn-expandir-chat" class="chat-btn-ico toggle" title="Expandir/Minimizar chat">💬</button>
        <input type="text" id="chat-input" placeholder="Pregunta sobre {{ tag }} o pulsa 🎙️..." autocomplete="off">
        <button type="button" id="chat-btn-mic" class="chat-btn-ico mic" title="Dictar nota de voz (estilo WhatsApp)">
          <svg class="svg-icon" viewBox="0 0 24 24" width="18" height="18" stroke="currentColor" stroke-width="2" fill="none"><path d="M12 2a3 3 0 0 0-3 3v7a3 3 0 0 0 6 0V5a3 3 0 0 0-3-3Z"/><path d="M19 10v2a7 7 0 0 1-14 0v-2"/><line x1="12" y1="19" x2="12" y2="22"/></svg>
        </button>
        <button type="submit" id="btn-enviar-chat" class="chat-btn-ico send" title="Enviar mensaje">
          <svg class="svg-icon" viewBox="0 0 24 24" width="18" height="18" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" fill="none"><line x1="22" y1="2" x2="11" y2="13"/><polygon points="22 2 15 22 11 13 2 9 22 2"/></svg>
        </button>
      </form>
    </div>
  </div>
</main>
<script src="/static/ja-core.js?v={{ pwa_v or 'dev' }}"></script>
<script src="/static/app.js?v={{ pwa_v or 'dev' }}"></script>
<script src="/static/sw-register.js?v={{ pwa_v or 'dev' }}" defer></script>
</body>
</html>
