<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Ficha {{ tag }} · Bitácora JA</title>
<meta name="theme-color" content="#2F5233">
<link rel="manifest" href="/manifest.json">
<link rel="icon" href="/static/favicon.png" type="image/png">
<link rel="icon" href="/static/favicon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="/static/icon-192.png">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="stylesheet" href="/static/style.css?v=43">
</head>
<body data-tag="{{ tag }}">
<div id="barra-red">📡 Sin conexión — mostrando datos guardados. Reconectando…</div>
<header>
  <span class="marca-titulo"><a href="/" style="text-decoration:none; color:inherit; display:inline-flex; align-items:center; gap:6px;"><img src="/static/logo.jpg" class="logo-ja" alt="Logo Ganadería JA" width="22" height="22">← Tablero</a> · <span style="display:inline-flex; align-items:center; gap:5px;"><svg class="svg-icon" viewBox="0 0 24 24" width="16" height="16" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" fill="none"><path d="M17.8 15.1a10 10 0 0 0 .9-7.1h.3c1.7 0 3-1.3 3-3V3h-3c-1.3 0-2.4.8-2.8 1.9a10 10 0 0 0-8.4 0C7.4 3.8 6.3 3 5 3H2v2c0 1.7 1.3 3 3 3h.3a10 10 0 0 0 .9 7.1M9 9.5v.5m6-.5v.5"/><path d="M15 22a4 4 0 1 0-3-6.6A4 4 0 1 0 9 22Zm-6-4h.01M15 18h.01"/></svg><span>Ficha</span></span> <b>{{ tag }}</b></span>
  <span class="acciones">
    <button id="btn-chat" class="tema-btn" title="Asistente IA (Chat)"><svg class="svg-icon" viewBox="0 0 24 24" width="15" height="15" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" fill="none"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/></svg></button>
    <button id="btn-ayuda" class="tema-btn" title="Centro de Ayuda y Manuales" aria-label="Ayuda"><svg class="svg-icon" viewBox="0 0 24 24" width="15" height="15" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" fill="none"><circle cx="12" cy="12" r="10"/><path d="M9.09 9a3 3 0 0 1 5.83 1c0 2-3 3-3 3"/><line x1="12" y1="17" x2="12.01" y2="17"/></svg></button>
    <select id="select-tema" class="tema-btn" title="Estilo visual" aria-label="Cambiar tema">
      <option value="green">Verde Campestre</option>
      <option value="sun">Sol de Campo</option>
      <option value="light">Claro Editorial</option>
      <option value="dark">Modo Oscuro</option>
    </select>
    <a href="/logout" class="salir">Salir</a>
  </span>
</header>
<main>
  <div id="ficha" class="card">Cargando…</div>

  <!-- Modal Asistente IA (Chat) -->
  <div id="modal-chat" class="modal-overlay" style="display:none">
    <div class="modal-contenido chat-modal">
      <div class="modal-header">
        <span style="display:inline-flex; align-items:center; gap:8px;"><img src="/static/logo.jpg" class="logo-ja" alt="Logo Ganadería JA" width="22" height="22"><b>Asistente IA · Ganadería JA</b></span>
        <button class="modal-cerrar" id="btn-cerrar-chat">✕</button>
      </div>
      <div id="chat-historial" class="chat-cuerpo">
        <div class="chat-msg bot">Hola. Soy el asistente zootécnico de la finca. Puedes hacerme preguntas sobre este animal <b>{{ tag }}</b> o la finca en general.</div>
      </div>
      <div class="chat-sugerencias">
        <button class="chip-sug" data-p="¿cuántas crías registradas tiene el animal {{ tag }}?"><svg class="svg-icon" viewBox="0 0 24 24" width="13" height="13" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" fill="none" style="display:inline-block; vertical-align:middle; margin-right:4px;"><path d="M17.8 15.1a10 10 0 0 0 .9-7.1h.3c1.7 0 3-1.3 3-3V3h-3c-1.3 0-2.4.8-2.8 1.9a10 10 0 0 0-8.4 0C7.4 3.8 6.3 3 5 3H2v2c0 1.7 1.3 3 3 3h.3a10 10 0 0 0 .9 7.1M9 9.5v.5m6-.5v.5"/><path d="M15 22a4 4 0 1 0-3-6.6A4 4 0 1 0 9 22Zm-6-4h.01M15 18h.01"/></svg>Crías de {{ tag }}</button>
        <button class="chip-sug" data-p="¿cuál es el estado reproductivo de {{ tag }}?"><svg class="svg-icon" viewBox="0 0 24 24" width="13" height="13" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" fill="none" style="display:inline-block; vertical-align:middle; margin-right:4px;"><path d="M8 2h8"/><path d="M9 2v2.789a4 4 0 0 1-.672 2.219l-.656.984A4 4 0 0 0 7 10.212V20a2 2 0 0 0 2 2h6a2 2 0 0 0 2-2v-9.789a4 4 0 0 0-.672-2.219l-.656-.984A4 4 0 0 1 15 4.788V2"/><path d="M7 15a6.472 6.472 0 0 1 5 0 6.47 6.47 0 0 0 5 0"/></svg>Estado de {{ tag }}</button>
        <button class="chip-sug" data-p="¿qué animales están en retiro de leche o carne?"><svg class="svg-icon" viewBox="0 0 24 24" width="13" height="13" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" fill="none" style="display:inline-block; vertical-align:middle; margin-right:4px;"><path d="m10.5 20.5 10-10a4.95 4.95 0 1 0-7-7l-10 10a4.95 4.95 0 1 0 7 7Z"/><path d="m8.5 8.5 7 7"/></svg>Retiros activos</button>
        <button class="chip-sug" data-p="¿cuánto ganado activo hay en la finca?"><svg class="svg-icon" viewBox="0 0 24 24" width="13" height="13" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" fill="none" style="display:inline-block; vertical-align:middle; margin-right:4px;"><path d="M17.8 15.1a10 10 0 0 0 .9-7.1h.3c1.7 0 3-1.3 3-3V3h-3c-1.3 0-2.4.8-2.8 1.9a10 10 0 0 0-8.4 0C7.4 3.8 6.3 3 5 3H2v2c0 1.7 1.3 3 3 3h.3a10 10 0 0 0 .9 7.1M9 9.5v.5m6-.5v.5"/><path d="M15 22a4 4 0 1 0-3-6.6A4 4 0 1 0 9 22Zm-6-4h.01M15 18h.01"/></svg>Total hato</button>
      </div>
      <form id="form-chat" class="chat-footer">
        <input type="text" id="chat-input" placeholder="Pregunta algo sobre este animal o la finca..." autocomplete="off">
        <button type="submit" id="btn-enviar-chat">Enviar</button>
      </form>
    </div>
  </div>
</main>
<script src="/static/app.js?v=43"></script>
<script>
if ("serviceWorker" in navigator) {
  window.addEventListener("load", function () {
    navigator.serviceWorker.register("/sw.js").catch(function (e) { /* best-effort */ });
  });
}
</script>
</body>
</html>
