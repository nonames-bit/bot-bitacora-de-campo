<body>
<div id="barra-red">Sin conexión — mostrando datos locales. Reconectando…</div>
<header>

      <option value="light">Claro Editorial</option>
      <option value="dark">Modo Oscuro</option>
    </select>
    <a href="/logout" class="salir">Salir</a>
  </span>
</header>

<main>
<div class="card filtros">
  <label>Potrero: <input id="f-potrero" placeholder="ej. Guayabal" autocomplete="off" list="dl-potreros"></label>
  <label>Tag: <input id="f-tag" placeholder="ej. 47 · N069" autocomplete="off" list="dl-tags"></label>
  <button id="btn-cargar">Cargar</button>
  <datalist id="dl-potreros"></datalist>
  <datalist id="dl-tags"></datalist>
</div>
<div id="vista" class="card">Cargando…</div>
</main>
<script src="/static/app.js"></script>
