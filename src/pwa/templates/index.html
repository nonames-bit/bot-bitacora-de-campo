<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Bitácora JA · Dashboard</title>
<meta name="theme-color" content="#2F5233">
<meta name="description" content="Tablero ejecutivo Ganadería JA">
<link rel="manifest" href="/manifest.json">
<link rel="icon" href="/static/favicon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="/static/icon-192.png">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="stylesheet" href="/static/style.css">
</head>
<body>
<div id="barra-red">📡 Sin conexión — mostrando datos guardados. Reconectando…</div>
<header>
  <b>🐮 GANADERÍA JA · Tablero ejecutivo</b>
  <span class="acciones">
    <span class="reloj" id="reloj-hora"></span>
    <button id="btn-tema" class="tema-btn" title="Cambiar tema" aria-label="Cambiar tema">☀️</button>
    <a href="/logout" class="salir">Salir</a>
  </span>
</header>
<nav>
<button data-v="tablero" class="act">🐮 Tablero</button>
<button data-v="agenda">📋 Agenda</button>
<button data-v="inventario">📊 Inventario</button>
<button data-v="poblacion">📈 Población</button>
<button data-v="genetica">🧬 Genética</button>
<button data-v="repro">🤰 Reproducción</button>
<button data-v="sanidad">💉 Sanidad</button>
<button data-v="pasturas">🌿 Pasturas</button>
<button data-v="leche">🥛 Leche</button>
<button data-v="ficha">🔎 Ficha</button>
</nav>
<main>
<div class="card filtros"><label>Potrero: <input id="f-potrero" placeholder="ej. Guayabal" autocomplete="off" list="dl-potreros"></label>
<label>Tag: <input id="f-tag" placeholder="ej. 47 · N069 · RFID" autocomplete="off" list="dl-tags"></label>
<button id="btn-cargar">Cargar</button>
<datalist id="dl-potreros"></datalist>
<datalist id="dl-tags"></datalist></div>
<div id="vista" class="card">Cargando…</div>
</main>
<script src="/static/app.js"></script>
<script>
if ("serviceWorker" in navigator) {
  window.addEventListener("load", function () {
    navigator.serviceWorker.register("/sw.js").catch(function (e) { /* best-effort */ });
  });
}
</script>
</body>
</html>
