<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Ingresar · Bitácora JA</title>
<meta name="theme-color" content="#2F5233">
<meta name="description" content="Acceso al tablero ejecutivo Ganadería JA">
<link rel="manifest" href="/manifest.json">
<link rel="icon" href="/static/favicon.png" type="image/png">
<link rel="icon" href="/static/favicon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="/static/icon-192.png">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="stylesheet" href="/static/style.css?v={{ pwa_v or 'dev' }}">
<style>
body{display:flex;min-height:100vh;align-items:center;justify-content:center;padding:16px;background:var(--fondo, #f5f6f8)}
.card{width:100%;max-width:340px;padding:32px 24px;border-radius:14px;box-shadow:0 4px 18px rgba(0,0,0,0.08);background:var(--card-bg, #fff);text-align:center}
h1{font-size:20px;color:var(--verde-marca, #2F5233);margin:0 0 6px;font-weight:700}
p.sub{color:#666;font-size:13px;margin:0 0 20px}
.pin-box{margin:18px 0}
.pin-input{width:100%;font-size:24px;letter-spacing:6px;text-align:center;padding:12px 8px;border:2px solid #ccc;border-radius:10px;outline:none;font-weight:700;box-sizing:border-box}
.pin-input:focus{border-color:var(--verde-marca, #2F5233)}
label{display:block;font-size:13px;margin:12px 0 4px;color:#444;text-align:left}
.btn-ingresar{width:100%;padding:14px;margin-top:16px;border:0;border-radius:10px;background:var(--verde-marca, #2F5233);color:#fff;font-size:16px;font-weight:600;cursor:pointer}
.btn-ingresar:hover{opacity:0.92}
.btn-huella{width:100%;padding:14px;border:1px solid var(--verde-marca, #2F5233);border-radius:10px;background:transparent;color:var(--verde-marca, #2F5233);font-size:15px;font-weight:700;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;gap:9px}
.btn-huella:hover{background:rgba(47,82,51,0.06)}
.huella-msg{font-size:12px;color:#666;margin:8px 0 0;min-height:14px}
.divisor-o{display:flex;align-items:center;gap:10px;margin:16px 0 4px;color:#999;font-size:12px}
.divisor-o::before,.divisor-o::after{content:"";flex:1;height:1px;background:#e2e2e2}
.ayuda-pin{font-size:12px;color:#777;margin-top:14px;line-height:1.4}
.error{color:var(--rojo, #c62828);font-size:13px;margin-top:12px;font-weight:500}
</style>
</head>
<body>
<div class="card">
  <img src="/static/logo.jpg" alt="Logo Ganadería JA" width="76" height="76" style="display:block; margin:0 auto 14px; border-radius:50%; box-shadow:0 4px 14px rgba(0,0,0,0.18); border: 2px solid rgba(47,82,51,0.25); object-fit:cover;">
  <h1>GANADERÍA JA</h1>
  <p class="sub">Bitácora de Campo & Tablero</p>

  <div id="box-huella-login" style="display:none;">
    <button id="btn-huella-login" type="button" class="btn-huella">
      <svg viewBox="0 0 24 24" width="20" height="20" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" fill="none" aria-hidden="true"><path d="M12 10a2 2 0 0 0-2 2c0 1.02-.1 2.51-.26 4"/><path d="M14 13.12c0 2.38 0 6.38-1 8.88"/><path d="M17.29 21.02c.12-.6.43-2.3.5-3.02"/><path d="M2 12a10 10 0 0 1 18-6"/><path d="M2 16h.01"/><path d="M21.8 16c.2-2 .131-5.354 0-6"/><path d="M5 19.5C5.5 18 6 15 6 12a6 6 0 0 1 .34-2"/><path d="M8.65 22c.21-.66.45-1.32.57-2"/><path d="M9 6.8a6 6 0 0 1 9 5.2v2"/></svg>
      Ingresar con huella / Face ID
    </button>
    <p id="huella-msg" class="huella-msg" aria-live="polite"></p>
    <div class="divisor-o"><span>o use su PIN</span></div>
  </div>

  <form method="post" action="/login">
    <div class="pin-box">
      <input type="password" id="password" name="password" class="pin-input" placeholder="••••" autofocus required inputmode="numeric" autocomplete="current-password">
    </div>
    <button type="submit" class="btn-ingresar">Ingresar</button>
    <p class="ayuda-pin">
      👉 Digite su <b>PIN de 4 dígitos</b> asignado<br>o la contraseña general.
    </p>
  </form>
  {% if error %}<p class="error">❌ PIN o contraseña incorrecta.</p>{% endif %}
  <div id="box-instalar-login" style="margin-top:20px; border-top:1px solid #eee; padding-top:14px; display:none;">
    <button id="btn-instalar-login" type="button" class="btn-secundario-instalar" style="background:#e8f5e9; color:#2F5233; border:1px solid #c8e6c9; border-radius:8px; padding:10px 14px; font-size:13px; font-weight:600; cursor:pointer; width:100%; display:inline-flex; align-items:center; justify-content:center; gap:8px;">
      <svg viewBox="0 0 24 24" width="16" height="16" stroke="currentColor" stroke-width="2" fill="none"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg>
      📲 Instalar Bitácora JA en tu celular
    </button>
  </div>
</div>
<script src="/static/login.js?v={{ pwa_v or 'dev' }}" defer></script>
</body>
</html>
